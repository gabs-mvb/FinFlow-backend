deploy:
  needs: image

  if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

  runs-on: ubuntu-latest
  timeout-minutes: 15

  permissions:
    id-token: write
    contents: read

  steps:
    - name: Authenticate with AWS
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: sa-east-1
        audience: sts.amazonaws.com
        role-session-name: FinFlow-${{ github.run_id }}

    - name: Deploy backend via SSM
      shell: bash
      env:
        INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

      run: |
        set -euo pipefail

        DEPLOY_SCRIPT=$(cat <<'EOF'
        set -euo pipefail

        echo "========================================"
        echo "FinFlow - iniciando deploy"
        echo "========================================"

        cd /opt/finflow

        echo ""
        echo "Baixando nova imagem..."
        sudo -H -u ubuntu docker compose pull backend

        echo ""
        echo "Recriando container..."
        sudo -H -u ubuntu docker compose up -d --no-deps --force-recreate backend

        echo ""
        echo "Containers atuais:"
        sudo -H -u ubuntu docker compose ps

        echo ""
        echo "Aguardando backend iniciar..."
        sleep 15

        echo ""
        echo "Verificando estado do container..."

        RUNNING=$(docker inspect -f '{{.State.Running}}' finflow-backend)

        if [ "$RUNNING" != "true" ]; then
          echo "ERRO: finflow-backend não está executando."
          docker logs --tail=100 finflow-backend
          exit 1
        fi

        echo ""
        echo "Backend está executando."

        echo ""
        echo "========================================"
        echo "Deploy concluído"
        echo "========================================"
        EOF
        )

        PARAMETERS=$(jq -n \
          --arg command "$DEPLOY_SCRIPT" \
          '{commands: [$command]}')

        echo "Enviando comando para EC2..."

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "FinFlow deploy - $GITHUB_SHA" \
          --parameters "$PARAMETERS" \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        echo "Aguardando execução..."

        if ! aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID"
        then
          echo "Deploy falhou."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          exit 1
        fi

        echo "Resultado do deploy:"

        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$INSTANCE_ID" \
          --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'