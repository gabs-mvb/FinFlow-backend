spring:
  datasource:
    url: jdbc:h2:mem:finflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-that-should-be-at-least-32-characters-long
  expiration: 86400000

finflow:
  security:
    api-key: test-api-key
  open-finance:
    provider: disabled
