spring:
  datasource:
    url: jdbc:h2:mem:finflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-for-jwt-that-should-be-at-least-32-characters-long
  expiration: 86400000

finflow:
  planning:
    ai:
      responses-uri: http://127.0.0.1:1/responses
  security:
    allowed-origins: http://localhost:3000
  open-finance:
    provider: disabled
