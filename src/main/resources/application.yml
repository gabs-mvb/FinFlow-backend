spring:
  application:
    name: FinFlow
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validateOnMigrate: false
    outOfOrder: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

finflow:
  planning:
    ai:
      enabled: ${PLANNING_AI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      responses-uri: https://api.openai.com/v1/responses
      timeout-seconds: ${PLANNING_AI_TIMEOUT_SECONDS:60}
  security:
    allowed-origins: ${ALLOWED_ORIGINS}
  open-finance:
    provider: ${OPEN_FINANCE_PROVIDER:disabled}
