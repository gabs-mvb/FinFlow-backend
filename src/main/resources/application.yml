spring:
  application:
    name: FinFlow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/finflow}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:dHJhY2tzYWZlZG9lc2VhcmxpZXJzaGVlcGZvb3RiYWxsb2JqZWN0cGxhaW5zaGVsdGVtZW4xZ3k5bW9weWM1ZzZnb3l6dmxwcXZ4YXpyZnF3aXVkeWF3eXN4dDZydGxpbmVxYnR5Ykl0ZWxxcnN3MA==}
  expiration: ${JWT_EXPIRATION:86400000}

finflow:
  security:
    api-key: dHJhY2tzYWZlZG9lc2VhcmxpZXJzaGVlcGZvb3RiYWxsb2JqZWN0cGxhaW5zaGVsdGU=
  open-finance:
    provider: ${OPEN_FINANCE_PROVIDER:disabled}

